name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # T15：live 门只在手动触发时运行（独立预算作业）。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Tests use the "test" profile (H2 in-memory, MODE=MySQL); no MySQL/Redis/MinIO needed.
      - name: Run Maven tests
        run: ./mvnw test

  # T15：deterministic contract + MySQL 作业——与 backend 同一套测试，差别是提供了真实 MySQL：
  # 类级 @EnabledIf TCP 探活会激活 MySQL 集成/契约类（本地同款）。任何一个失败都会使其变红。
  backend-mysql:
    name: Backend (MySQL contract + integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/platform
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven tests with MySQL reachable
        run: ./mvnw test

  # T15：真实上游只能在独立预算作业里跑（-Plive, groups=live）——手动触发，绝不进常规流水线。
  # 未配置通道/凭据时相关类按自身门禁 skip，并如实出现在报告里（不用 mock 补齐）。
  live-gates:
    name: Live gates (real upstream, separate budget)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: server/platform
    environment: ai-live-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run opt-in live gates
        env:
          AI_LIVE_GATE_BASE_URL: ${{ secrets.AI_LIVE_GATE_BASE_URL }}
          AI_LIVE_GATE_API_KEY: ${{ secrets.AI_LIVE_GATE_API_KEY }}
        run: ./mvnw -B test -Plive
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-gates-report
          path: server/platform/target/surefire-reports/

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build

  web-runner:
    name: Web runner (node:test + Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: server/web-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/web-runner/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Tests are hermetic: they serve a local 127.0.0.1 fixture and spawn server.mjs.
      - name: Run node:test suite
        run: npm test
