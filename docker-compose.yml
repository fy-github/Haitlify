services:
  mysql:
    image: mysql:8.4
    container_name: ai-test-platform-mysql
    environment:
      MYSQL_DATABASE: ai_test_platform
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: ai-test-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    container_name: ai-test-platform-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  web-runner:
    build:
      context: ./server/web-runner
    container_name: ai-test-platform-web-runner
    environment:
      APP_WEB_AUTOMATION_RUNNER_PORT: 9323
      # 容器内必须绑 0.0.0.0,否则 platform / nginx 无法访问(默认 127.0.0.1 仅本机回环)
      APP_WEB_AUTOMATION_RUNNER_HOST: "0.0.0.0"
      APP_WEB_AUTOMATION_RUNNER_BROWSER_CHANNEL: chromium
      APP_WEB_AUTOMATION_RUNNER_HEADLESS: "true"
      APP_WEB_AUTOMATION_RUNNER_STRICT_STARTUP: "false"
      # 开发环境的 ICC API 可能解析到内网地址;允许 Chromium 访问同一登录页依赖的私网 API。
      APP_WEB_AUTOMATION_RUNNER_ALLOW_LOCAL_NETWORK_ACCESS: "true"
      # 截图/产物绝对 URL 前缀须指向宿主可直达的新宿主端口(非宿主常用端口,避免被其他项目占用)
      APP_WEB_AUTOMATION_RUNNER_PUBLIC_URL: http://127.0.0.1:19323
    ports:
      - "19323:9323"

  platform:
    build:
      context: ./server/platform
    container_name: ai-test-platform-server
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      APP_DB_URL: jdbc:mysql://mysql:3306/ai_test_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      APP_DB_USERNAME: root
      APP_DB_PASSWORD: root
      # 32 字节 Base64 密钥;不设置则密钥明文存储(仅建议本地),生产必须设置
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      APP_WEB_AUTOMATION_RUNNER_ENABLED: "true"
      APP_WEB_AUTOMATION_RUNNER_BASE_URL: http://web-runner:9323
    ports:
      # 宿主侧用非常用端口 38081;容器内仍绑 8080(APP_PORT),nginx/healthcheck 不变
      - "38081:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
    container_name: ai-test-platform-web
    depends_on:
      platform:
        condition: service_healthy
    ports:
      - "38080:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:

# Compatibility (explicit migration procedure only): the existing Compose
# project is `cloudv4-api` and the named volumes/container identities above
# are intentionally unchanged. If this checkout is moved to a Haitlify
# directory, launch with `docker compose -p cloudv4-api -f
# /path/to/docker-compose.yml up -d` (or set COMPOSE_PROJECT_NAME=cloudv4-api)
# so live volumes are not replaced. Do not use this identity as the new brand.
