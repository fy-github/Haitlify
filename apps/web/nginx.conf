server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 上传体积上限：与平台 spring.servlet.multipart 上限（25MB）保持一致。
    # nginx 默认仅 1m，会把正常的需求文档/原型截图（数 MB）在上游之前直接 413。
    client_max_body_size 25m;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 这些是前端 SPA 路由,不要被 /api/ 后端代理规则或目录重定向接管。
    location = /api/ {
        return 301 /api;
    }

    location = /api {
        try_files /index.html =404;
    }

    location = /web-cases/ {
        return 301 /web-cases;
    }

    location = /web-cases {
        try_files /index.html =404;
    }

    # 后端 API:全路径透传(platform 控制器按 /api/** 映射)
    location /api/ {
        proxy_pass http://platform:8080;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 执行素材 / fixtures 由 web-runner 提供(路径原样透传)
    location /artifacts {
        proxy_pass http://web-runner:9323;
        proxy_set_header Host $host;
    }

    location /fixtures {
        proxy_pass http://web-runner:9323;
        proxy_set_header Host $host;
    }

    # 构建产物带 hash,长缓存;index.html 不缓存以便发布后立即生效
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
